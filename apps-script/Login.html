<style>
  .drive-login {max-width:420px; margin:60px auto; background:#fff; border-radius:12px; padding:30px; box-shadow:0 8px 24px #0001;}
  .drive-login button, .drive-toolbar button, #driveHistory button {background:#0078d4; padding:10px 15px; font-size:14px;}
  .drive-login button {width:100%; margin-top:20px;}
  .drive-toolbar {display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:20px;}
  .drive-toolbar span {flex:2; overflow-wrap:anywhere;}
  #driveHistory {padding:15px; margin:15px 0; background:#f4f8fc; border-radius:8px;}
  .drive-history-row {display:flex; gap:15px; align-items:center; padding:12px 0; border-bottom:1px solid #ddd;}
  .drive-history-row span {flex:3; overflow-wrap:anywhere; white-space:pre-line;}
  .drive-status {color:#555; min-height:1.3em; font-size:14px;}
  @media print {.drive-login, .drive-toolbar, #driveHistory, .drive-status {display:none!important;}}
</style>
<section id="driveLogin" class="drive-login">
  <h1>Preventivatore 3DMV</h1>
  <p class="muted">Accedi per creare un preventivo e ritrovare il tuo storico.</p>
  <form id="driveLoginForm">
    <label for="driveEmail">Email</label>
    <input id="driveEmail" name="username" type="email" autocomplete="username" required>
    <label for="drivePassword">Password</label>
    <input id="drivePassword" name="password" type="password" autocomplete="current-password" required>
    <button id="driveLoginSubmit" type="submit">Accedi</button>
  </form>
  <p id="driveLoginStatus" class="drive-status" role="status" aria-live="polite"></p>
</section>
<script>
(() => {
  let token = '';
  let initialized = false;
  let busy = false;
  const app = document.querySelector('.container');
  const loginPanel = document.getElementById('driveLogin');
  const loginStatus = document.getElementById('driveLoginStatus');
  const baseStorageKey = STORAGE_KEY;
  const toolbar = document.createElement('div');
  toolbar.className = 'drive-toolbar';
  toolbar.innerHTML = '<span id="driveUser"></span><button type="button" id="driveSave">Salva preventivo</button><button type="button" id="driveShowHistory">Storico</button><button type="button" id="driveLogout">Esci</button>';
  const status = document.createElement('p');
  status.className = 'drive-status';
  status.setAttribute('role', 'status');
  status.setAttribute('aria-live', 'polite');
  const history = document.createElement('section');
  history.id = 'driveHistory';
  history.hidden = true;
  app.prepend(history);
  app.prepend(status);
  app.prepend(toolbar);

  function rpc(method, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args);
    });
  }
  function message(error) {
    return error && error.message ? error.message.replace(/^Exception:\s*/, '') : 'Operazione non riuscita. Riprova.';
  }
  async function operation(fn) {
    if (busy) return;
    busy = true;
    toolbar.querySelectorAll('button').forEach(button => button.disabled = true);
    try { await fn(); }
    catch (error) {
      status.textContent = message(error);
      if (status.textContent.includes('Sessione scaduta')) {
        token = '';
        app.style.display = 'none';
        loginPanel.hidden = false;
        loginStatus.textContent = 'Sessione scaduta. Accedi di nuovo.';
      }
    }
    finally {
      busy = false;
      toolbar.querySelectorAll('button').forEach(button => button.disabled = false);
    }
  }

  document.getElementById('driveLoginForm').addEventListener('submit', async event => {
    event.preventDefault();
    const submit = document.getElementById('driveLoginSubmit');
    submit.disabled = true;
    loginStatus.textContent = 'Accesso in corso…';
    try {
      const result = await rpc('login', document.getElementById('driveEmail').value, document.getElementById('drivePassword').value);
      document.getElementById('drivePassword').value = '';
      // Per cambiare utente si usa Esci, che ricarica completamente la pagina.
      if (initialized && document.getElementById('driveUser').textContent !== result.email) {
        await rpc('logout', result.token);
        throw new Error('Per cambiare utente ricarica la pagina.');
      }
      token = result.token;
      STORAGE_KEY = baseStorageKey + '_user_' + encodeURIComponent(result.email);
      PREVIOUS_STATE_KEY = STORAGE_KEY + '_previous_quote';
      document.getElementById('driveUser').textContent = result.email;
      if (!initialized) {
        await init();
        initialized = true;
      }
      loginPanel.hidden = true;
      app.style.display = 'block';
      status.textContent = 'Salva i preventivi per aggiungerli al tuo storico.';
      loginStatus.textContent = '';
    } catch (error) { loginStatus.textContent = message(error); }
    finally {
      document.getElementById('drivePassword').value = '';
      submit.disabled = false;
    }
  });

  document.getElementById('driveSave').addEventListener('click', () => operation(async () => {
    const data = getDatiLordi();
    if (!data) throw new Error('Compila quantità, tempi e dati del preventivo.');
    status.textContent = 'Salvataggio su Drive…';
    const total = data.totale3DMV * (1 - parseNumberLoose(safeVal('sconto3DMV')) / 100)
      + data.totaleSTR * (1 - parseNumberLoose(safeVal('scontoSTR')) / 100);
    await rpc('saveQuote', token, {state: captureState(), total});
    status.textContent = 'Preventivo salvato su Drive.';
    if (!history.hidden) await showHistory();
  }));

  async function showHistory() {
    status.textContent = 'Caricamento storico…';
    const rows = await rpc('listQuotes', token);
    history.replaceChildren();
    const title = document.createElement('h3');
    title.textContent = 'I tuoi preventivi';
    history.append(title);
    history.hidden = false;
    if (!rows.length) {
      const empty = document.createElement('p');
      empty.textContent = 'Non hai ancora salvato preventivi.';
      history.append(empty);
    }
    for (const row of rows) {
      const line = document.createElement('div');
      line.className = 'drive-history-row';
      const label = document.createElement('span');
      label.textContent = row.numero + ' — ' + row.parte + '\n'
        + new Date(row.savedAt).toLocaleString('it-IT') + ' · '
        + row.pezzi + ' pz · ' + fmtMoney.format(Number(row.totale));
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = 'Ricarica';
      button.addEventListener('click', () => operation(async () => {
        if (!window.confirm('Ricaricare questo preventivo? Le modifiche non salvate verranno sostituite.')) return;
        const saved = await rpc('loadQuote', token, row.id);
        applyState(defaultState);
        applyState(saved.state);
        showingDefaults = false;
        document.getElementById('btnValori').textContent = '🆕 Nuovo preventivo (valori di default)';
        calcolaStandard();
        history.hidden = true;
        status.textContent = 'Preventivo ricaricato: ' + row.numero + '.';
      }));
      line.append(label, button);
      history.append(line);
    }
    status.textContent = rows.length + ' preventivi nello storico.';
  }
  document.getElementById('driveShowHistory').addEventListener('click', () => operation(async () => {
    if (!history.hidden) { history.hidden = true; return; }
    await showHistory();
  }));
  document.getElementById('driveLogout').addEventListener('click', () => operation(async () => {
    await rpc('logout', token);
    token = '';
    // Non persiste credenziali o sessioni; rimuove i dati dalla memoria della pagina.
    window.location.reload();
  }));
})();
</script>
